# Mirror Memory -- extraction configuration
# Keywords and context tags used by detect_topics and K1 extraction.
# All values are generic (zero domain coupling).

context_tags:
  - work
  - family
  - health
  - education
  - social
  - finance
  - travel
  - hobby
  - relationship

keywords:
  topic:
    - work
    - job
    - career
    - family
    - health
    - travel
    - hobby
    - education
    - food
    - music
    - movie
    - book
    - sport
    - pet
    - weather
    - technology
    - finance
    - relationship
    - friend
    - school
    - game
    - cook
    - read
    - sleep
    - exercise
    - doctor
    - money
    - invest
    - savings

  preference:
    - prefer
    - like
    - love
    - enjoy
    - hate
    - dislike
    - favorite
    - interested
    - boring
    - exciting
    - amazing
    - terrible

  fact:
    - I am
    - I work
    - I live
    - I have
    - my name
    - years old
    - I'm
    - I've
    - I graduated
    - I studied
    - born
    - grew up

  event:
    - happened
    - happened to me
    - last week
    - yesterday
    - recently
    - last month
    - last year
    - today
