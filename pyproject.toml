[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirror-memory"
version = "0.1.0"
description = "Structured memory engine for AI agents — belief lifecycle, confidence weighting, retrieval scoring, shadow snapshots."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30", "openai>=1.0,<2.0"]
llm = ["openai>=1.0,<2.0"]
dev = ["pytest>=8.0", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/mirror_memory"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
