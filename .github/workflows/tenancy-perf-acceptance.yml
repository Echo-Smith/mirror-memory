name: tenancy-perf-acceptance

# Part 1 of the Notion handoff page: re-measure the tenancy-hook perf
# acceptance numbers on a clean, dedicated runner (base 7f783bc vs fix
# 17a244b), interleaved, plus the queue-head/queue-tail accumulation check
# and the "large statements 6.5% faster than no-hook" attribution run.

on:
  workflow_dispatch:
    inputs:
      base_rev:
        description: "Baseline revision"
        default: "7f783bc"
      fix_rev:
        description: "Fixed revision to measure"
        default: "17a244b"

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (one venv, shared by both revisions)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,llm,dev]"

      - name: Interleaved measurement (base vs fix)
        env:
          BASE: ${{ inputs.base_rev || '7f783bc' }}
          FIX: ${{ inputs.fix_rev || '17a244b' }}
        run: |
          set -u
          measure() {  # $1 = label; remaining args passed to pytest
            local label="$1"; shift
            local start end rc tail_line
            start=$(python -c 'import time; print(time.monotonic())')
            pytest -q -p no:cacheprovider "$@" > /tmp/pytest_out.txt 2>&1 || true
            end=$(python -c 'import time; print(time.monotonic())')
            tail_line=$(tail -1 /tmp/pytest_out.txt | tr -d '\n')
            rc_line=$(grep -oE '[0-9]+ (passed|failed)' /tmp/pytest_out.txt | tail -1)
            echo "$label secs=$(python -c "print(f'{$end-$start:.1f}')") | $rc_line"
          }

          move_spike_tests() {  # keep both revisions running the same 1014 tests
            mkdir -p /tmp/spike_tests
            mv tests/test_tenant_isolation.py /tmp/spike_tests/ 2>/dev/null || true
            mv tests/test_tenant_cache_security.py /tmp/spike_tests/ 2>/dev/null || true
          }
          restore_spike_tests() {
            mv /tmp/spike_tests/test_tenant_isolation.py tests/ 2>/dev/null || true
            mv /tmp/spike_tests/test_tenant_cache_security.py tests/ 2>/dev/null || true
          }

          echo "=== FULL SUITE: interleaved base/fix x3 ===" | tee -a "$GITHUB_STEP_SUMMARY"
          FULL_RESULTS=/tmp/full_results.txt
          : > "$FULL_RESULTS"
          for round in 1 2 3; do
            for rev in "$BASE" "$FIX"; do
              git checkout -q "$rev" -- src tests pyproject.toml
              move_spike_tests
              if [ "$rev" = "$FIX" ]; then export MM_SQL_AUDIT=0; else unset MM_SQL_AUDIT || true; fi
              R=$(measure "full $rev round$round")
              echo "$R" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "$R" >> "$FULL_RESULTS"
            done
          done
          restore_spike_tests

          echo "=== LONGRUN FILE: interleaved base/fix x3 ===" | tee -a "$GITHUB_STEP_SUMMARY"
          for round in 1 2 3; do
            for rev in "$BASE" "$FIX"; do
              git checkout -q "$rev" -- src tests pyproject.toml
              move_spike_tests
              if [ "$rev" = "$FIX" ]; then export MM_SQL_AUDIT=0; else unset MM_SQL_AUDIT || true; fi
              R=$(measure "longrun $rev round$round" tests/test_longrun_bench.py)
              echo "$R" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done
          restore_spike_tests

      - name: Queue-head vs queue-tail accumulation check (fix revision)
        env:
          FIX: ${{ inputs.fix_rev || '17a244b' }}
          TARGET: tests/test_longrun_bench.py::TestOracleDetectsDamage::test_resurrection_is_caught
        run: |
          set -u
          git checkout -q "$FIX" -- src tests pyproject.toml
          timed() {  # $1 = label, rest = pytest args
            local label="$1"; shift
            local start end
            start=$(python -c 'import time; print(time.monotonic())')
            pytest -q -p no:cacheprovider "$@" > /tmp/pytest_out.txt 2>&1 || true
            end=$(python -c 'import time; print(time.monotonic())')
            local rc_line
            rc_line=$(grep -oE '[0-9]+ (passed|failed)' /tmp/pytest_out.txt | tail -1)
            echo "$label secs=$(python -c "print(f'{$end-$start:.1f}')") | $rc_line" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          echo "=== ACCUMULATION: target at queue head vs queue tail (x3) ===" | tee -a "$GITHUB_STEP_SUMMARY"
          for round in 1 2 3; do
            timed "head round$round" "$TARGET"
          done
          for round in 1 2 3; do
            timed "tail round$round" tests/test_tenant_isolation.py "$TARGET"
          done

      - name: "Attribution: large-statement -6.5% (index removal vs noise)"
        env:
          FIX: ${{ inputs.fix_rev || '17a244b' }}
        run: |
          set -u
          git checkout -q "$FIX" -- src tests pyproject.toml
          echo "=== ATTRIBUTION: driver_bench large-statements, no-index vs restored-index ===" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "--- as committed (indexes removed) ---" | tee -a "$GITHUB_STEP_SUMMARY"
          python driver_bench.py 2>&1 | tail -8 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "--- with single-column tenant indexes restored ---" | tee -a "$GITHUB_STEP_SUMMARY"
          python - <<'EOF'
          import re
          p = "src/mirror_memory/core/tenancy.py"
          src = open(p).read()
          src = src.replace(
              'return Column(String(64), nullable=False, default="")',
              'return Column(String(64), nullable=False, default="", index=True)',
          )
          open(p, "w").write(src)
          print("indexes restored:", src.count('default="", index=True'))
          EOF
          python driver_bench.py 2>&1 | tail -8 | tee -a "$GITHUB_STEP_SUMMARY"
          git checkout -q "$FIX" -- src

      - name: Final sanity (full suite on fix revision, all spike tests included)
        run: |
          git checkout -q "$FIX" -- src tests pyproject.toml
          pytest -q -p no:cacheprovider 2>&1 | tail -2 | tee -a "$GITHUB_STEP_SUMMARY"
