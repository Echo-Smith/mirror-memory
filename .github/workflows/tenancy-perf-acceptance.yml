name: tenancy-perf-acceptance

# M1 batch-2 task 0 methodology: both revisions run the IDENTICAL test set
# (ID intersection collected up front), every run produces junit XML, and a
# round is valid only if both sides passed the same number of tests with
# zero failures/errors.  Ratios are computed from valid rounds only.

on:
  workflow_dispatch:
    inputs:
      base_rev:
        description: "Baseline revision"
        default: "7f783bc"
      fix_rev:
        description: "Fixed revision to measure"
        default: "2cedfa7"

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (one venv, shared by both revisions)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,llm,dev]"
          # cross-revision parity: the BASE revision may lack optional
          # extras the fix side declares (and vice versa) -- install the
          # union explicitly so both sides can import the same modules
          pip install "sqlglot>=25.0"

      - name: Collect test-ID intersection (task 0 methodology)
        env:
          BASE: ${{ inputs.base_rev || '7f783bc' }}
          FIX: ${{ inputs.fix_rev || '2cedfa7' }}
        run: |
          set -eu
          python tools/perf_ids.py collect "$BASE" "$FIX" --out /tmp/ids.txt | tee -a "$GITHUB_STEP_SUMMARY"
          test -s /tmp/ids.txt

      - name: Interleaved measurement on the intersection (base vs fix)
        env:
          BASE: ${{ inputs.base_rev || '7f783bc' }}
          FIX: ${{ inputs.fix_rev || '2cedfa7' }}
        run: |
          set -u -o pipefail
          use_rev() {  # worktree src/tests must match the rev EXACTLY:
            # plain checkout never deletes files absent from the rev, which
            # silently changes the executed test set (task-0 lesson).
            local rev="$1"
            git ls-tree -r --name-only "$rev" -- src tests > /tmp/keep.txt
            for f in $(git ls-files -- src tests); do
              grep -qx "$f" /tmp/keep.txt || rm -f "$f"
            done
            for f in $(find tests src -name '*.py' 2>/dev/null); do
              grep -qx "$f" /tmp/keep.txt || rm -f "$f"
            done
            git checkout -q "$rev" -- src tests pyproject.toml
            git reset -q HEAD -- src tests || true
          }
          IDS=/tmp/ids.txt
          measure() {  # $1 = rev, $2 = round, $3 = xml path; runs the intersection
            local rev="$1" round="$2" xml="$3"
            use_rev "$rev"
            if [ "$rev" = "$FIX" ]; then export MM_SQL_AUDIT=0; else unset MM_SQL_AUDIT || true; fi
            local start end
            start=$(python -c 'import time; print(time.monotonic())')
            # run_ids.py passes each line as one argv entry -- parametrized
            # IDs containing spaces survive (shell word-splitting mangles them)
            python tools/run_ids.py "$IDS" -q -p no:cacheprovider --junitxml="$xml" > /tmp/pytest_out.txt 2>&1 || true
            end=$(python -c 'import time; print(time.monotonic())')
            echo "full $rev round$round secs=$(python -c "print(f'{$end-$start:.1f}')") | $(tail -1 /tmp/pytest_out.txt | grep -oE '[0-9]+ (passed|failed|skipped)([^|]*)' | head -1)"
          }

          echo "=== FULL SUITE (intersection IDs): interleaved base/fix x3 ===" | tee -a "$GITHUB_STEP_SUMMARY"
          for round in 1 2 3; do
            measure "$BASE" "$round" "/tmp/base_full_$round.xml" | tee -a "$GITHUB_STEP_SUMMARY"
            measure "$FIX"  "$round" "/tmp/fix_full_$round.xml"  | tee -a "$GITHUB_STEP_SUMMARY"
            if python tools/perf_ids.py verify "/tmp/base_full_$round.xml" "/tmp/fix_full_$round.xml" | tee -a "$GITHUB_STEP_SUMMARY"; then
              echo "round $round: VALID" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "round $round: INVALID (discarded from ratios)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "=== LONGRUN FILE: interleaved base/fix x3 ===" | tee -a "$GITHUB_STEP_SUMMARY"
          for round in 1 2 3; do
            for rev in "$BASE" "$FIX"; do
              use_rev "$rev"
              if [ "$rev" = "$FIX" ]; then export MM_SQL_AUDIT=0; else unset MM_SQL_AUDIT || true; fi
              start=$(python -c 'import time; print(time.monotonic())')
              python -m pytest -q -p no:cacheprovider --junitxml="/tmp/lr_${rev}_$round.xml" tests/test_longrun_bench.py > /tmp/pytest_out.txt 2>&1 || true
              end=$(python -c 'import time; print(time.monotonic())')
              echo "longrun $rev round$round secs=$(python -c "print(f'{$end-$start:.1f}')") | $(tail -1 /tmp/pytest_out.txt | grep -oE '[0-9]+ passed' | head -1)" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done

      - name: Queue-head vs queue-tail accumulation check (fix revision)
        env:
          FIX: ${{ inputs.fix_rev || '2cedfa7' }}
          TARGET: tests/test_longrun_bench.py::TestOracleDetectsDamage::test_resurrection_is_caught
        run: |
          set -u
          git checkout -q "$FIX" -- src tests pyproject.toml
          export MM_SQL_AUDIT=0
          timed() {
            local label="$1"; shift
            local start end
            start=$(python -c 'import time; print(time.monotonic())')
            python -m pytest -q -p no:cacheprovider "$@" > /tmp/pytest_out.txt 2>&1 || true
            end=$(python -c 'import time; print(time.monotonic())')
            echo "$label secs=$(python -c "print(f'{$end-$start:.1f}')") | $(grep -oE '[0-9]+ passed' /tmp/pytest_out.txt | tail -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          echo "=== ACCUMULATION: target at queue head vs queue tail (x3) ===" | tee -a "$GITHUB_STEP_SUMMARY"
          for round in 1 2 3; do
            timed "head round$round" "$TARGET"
          done
          for round in 1 2 3; do
            timed "tail round$round" tests/test_tenant_isolation.py "$TARGET"
          done

      - name: Multi-tenant vs single-tenant longrun (interleaved x3, fix revision)
        env:
          FIX: ${{ inputs.fix_rev || '2cedfa7' }}
        run: |
          set -u -o pipefail
          use_rev() {
            local rev="$1"
            git ls-tree -r --name-only "$rev" -- src tests > /tmp/keep.txt
            for f in $(git ls-files -- src tests); do
              grep -qx "$f" /tmp/keep.txt || rm -f "$f"
            done
            for f in $(find tests src -name '*.py' 2>/dev/null); do
              grep -qx "$f" /tmp/keep.txt || rm -f "$f"
            done
            git checkout -q "$rev" -- src tests pyproject.toml
            git reset -q HEAD -- src tests || true
          }
          use_rev "$FIX"
          export MM_SQL_AUDIT=0
          echo "=== MULTI vs SINGLE tenant longrun (interleaved x3) ===" | tee -a "$GITHUB_STEP_SUMMARY"
          for round in 1 2 3; do
            for mode in multi single; do
              if [ "$mode" = "single" ]; then export MM_SINGLE_TENANT=1; else unset MM_SINGLE_TENANT || true; fi
              start=$(python -c 'import time; print(time.monotonic())')
              python -m pytest -q -p no:cacheprovider tests/test_longrun_bench.py > /tmp/pytest_out.txt 2>&1 || true
              end=$(python -c 'import time; print(time.monotonic())')
              echo "longrun-$mode round$round secs=$(python -c "print(f'{$end-$start:.1f}')") | $(grep -oE '[0-9]+ passed' /tmp/pytest_out.txt | tail -1)" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done
          unset MM_SINGLE_TENANT || true

      - name: Final sanity (full suite on fix revision, all tests, auditor + guard on)
        env:
          FIX: ${{ inputs.fix_rev || '2cedfa7' }}
        run: |
          git checkout -q "$FIX" -- src tests pyproject.toml
          unset MM_SQL_AUDIT || true
          unset MM_SINGLE_TENANT || true
          python -m pytest -q -p no:cacheprovider 2>&1 | tail -2 | tee -a "$GITHUB_STEP_SUMMARY"
