name: statebench-gate

# Task 1 (M5): the StateBench v1.1 release gate, REPORT-ONLY.
#
# This workflow never turns CI red.  It runs the StateBench tracks, records the
# provenance manifest, evaluates bench.gate.check_release_gate with four-state
# per-track semantics (pass / fail / not_run / error), and writes a PASS/FAIL
# summary.  When the gate fails the first summary line is "FAIL: <items>"; the
# job itself still concludes success because the gate step is
# continue-on-error and the job is not a required check.
#
# Distinct, non-overwriting artifacts are produced and uploaded:
#   artifacts/statebench-gate.json             raw per-case report (gate subject)
#   artifacts/statebench-gate.manifest.json    commit, dataset sha, config hashes, model
#   artifacts/statebench-gate.forced.json      FORCED run raw report (separate)
#   artifacts/statebench-gate.forced.manifest.json   forced provenance manifest
#   artifacts/statebench-gate.production.json  PRODUCTION run raw report (separate)
#   artifacts/statebench-gate.production.manifest.json  production provenance manifest
#   artifacts/statebench-gate.verdict.json     gate verdict + per-check + four-state tracks
#   artifacts/statebench-gate-summary.md       Markdown summary (first line PASS:/FAIL:)
#
# Forced and production are always written to their own report+manifest pair so
# a failure in one can never erase the other's evidence.  The production run
# keeps its ACTUAL throttled coverage/extraction-health (it is never required to
# attempt every turn); only forced must prove an every-turn K2 attempt.
#
# LLM tracks (forced extraction + answerer) run ONLY when the MM_LLM_API_KEY
# secret is present.  When it is absent those tracks are recorded as `not_run`,
# which is NOT a pass.  A track that raises is recorded as `error` (an
# infrastructure failure), never `not_run` and never a pass (see
# tools/m5_statebench_ci.py and docs/statebench.md).
#
# Dataset version: the report carries the in-file `dataset_version` of
# statebench_v1_1.json (currently 1.2.0); it is printed in the summary so v1
# (statebench_v1.json) and v1.1 results are never confused.
#
# Triggers: manual dispatch, a weekly schedule, and pull requests touching the
# extraction / core / bench packages.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "src/mirror_memory/extraction/**"
      - "src/mirror_memory/core/**"
      - "src/mirror_memory/bench/**"

permissions:
  contents: read

jobs:
  gate:
    name: statebench-gate (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The manifest captures the commit; a full checkout keeps the hash
          # honest across shallow-clone edge cases.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,llm,dev,postgres]"

      - name: Run StateBench gate (report-only)
        id: gate
        # The gate step must never fail the job: a FAIL gate is data, not a CI
        # error.  The helper always exits 0; continue-on-error guards against an
        # unexpected crash so the workflow conclusion stays green.
        continue-on-error: true
        env:
          MM_LLM_API_KEY: ${{ secrets.MM_LLM_API_KEY }}
          MM_LLM_MODEL: ${{ vars.MM_LLM_MODEL || 'deepseek-chat' }}
          MM_LLM_BASE_URL: ${{ vars.MM_LLM_BASE_URL }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          # --allow-llm permits the LLM tracks; they still run only when
          # MM_LLM_API_KEY is present (the helper checks the env itself).
          # The helper writes four distinct files derived from --output.
          PYTHONPATH=src python tools/m5_statebench_ci.py \
            --allow-llm \
            --output artifacts/statebench-gate.json \
            --summary-out artifacts/statebench-gate-summary.md
          echo "helper-exit=${PIPESTATUS[0]}"

      - name: Write job summary
        if: always()
        run: |
          set -o pipefail
          SUMMARY=artifacts/statebench-gate-summary.md
          # The helper's Markdown starts with "PASS: ..." or "FAIL: ...".  That
          # MUST remain the literal first line of the job summary, so we do not
          # prepend any heading.
          if [ -f "$SUMMARY" ]; then
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FAIL: gate helper produced no summary (see logs)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decision (report-only, never red)
        if: always()
        # Surface the verdict, the four-state tracks, the dataset version, and
        # any infrastructure error without failing the job.
        env:
          VERDICT_JSON: artifacts/statebench-gate.verdict.json
        run: |
          if [ -f "$VERDICT_JSON" ]; then
            python - "$VERDICT_JSON" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print("gate verdict:", "PASS" if d.get("passed") else "FAIL")
          print("dataset version:", d.get("dataset_version"), "->", d.get("dataset_version_label"))
          tracks = d.get("tracks", {})
          for name in ("state", "recall", "answer", "forced", "production"):
              if name in tracks:
                  print(f"  {name}: {tracks[name].get('state')}")
          errors = [n for n, v in tracks.items() if v.get("state") == "error"]
          if errors:
              print("INFRASTRUCTURE ERROR in track(s):", ", ".join(errors))
          for key in ("report", "manifest", "forced_report", "forced_manifest",
                      "production_report", "production_manifest"):
              if d.get(key):
                  print(f"{key}: {d[key]}")
          PY
          else
            echo "gate verdict: FAIL (no verdict JSON produced)"
          fi

      - name: Upload raw report + manifest (forced & production saved separately)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statebench-gate-report
          path: |
            artifacts/statebench-gate.json
            artifacts/statebench-gate.manifest.json
            artifacts/statebench-gate.forced.json
            artifacts/statebench-gate.forced.manifest.json
            artifacts/statebench-gate.production.json
            artifacts/statebench-gate.production.manifest.json
          if-no-files-found: warn

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statebench-gate-verdict
          path: artifacts/statebench-gate.verdict.json
          if-no-files-found: warn

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statebench-gate-summary
          path: artifacts/statebench-gate-summary.md
          if-no-files-found: warn
