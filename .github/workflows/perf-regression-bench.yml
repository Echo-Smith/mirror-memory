name: perf-regression-bench

# M0 "固定的性能测量环境" — the interleaved in-process micro-benchmark
# (driver_bench.py) as a recurring performance regression check.
# Report-only: ratios are published to the step summary; hard gate
# thresholds are intentionally deferred until the M1 decomposition
# (tenancy-perf-decompose) fixes the acceptance口径.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"  # weekly, Monday 03:00 UTC

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,llm,dev]"

      - name: Run interleaved micro-benchmark
        run: |
          python driver_bench.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Full-suite timing with junit counts (task-0 methodology)
        run: |
          # Same-revision trend check: record wall time AND the exact
          # passed count from junit so week-over-week numbers stay
          # comparable (count changes invalidate comparison).
          start=$(python -c 'import time; print(time.monotonic())')
          python -m pytest -q -p no:cacheprovider --junitxml=/tmp/suite.xml > /tmp/pytest_out.txt 2>&1 || true
          end=$(python -c 'import time; print(time.monotonic())')
          secs=$(python -c "print(f'{$end-$start:.1f}')")
          counts=$(python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/suite.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
          t = sum(int(s.get('tests', 0)) for s in suites)
          f = sum(int(s.get('failures', 0)) for s in suites)
          e = sum(int(s.get('errors', 0)) for s in suites)
          sk = sum(int(s.get('skipped', 0)) for s in suites)
          print(f"tests={t} passed={t-f-e-sk} failed={f} errors={e} skipped={sk}")
          PY
          )
          echo "full-suite (auditor+guard on): ${secs}s | $counts" | tee -a "$GITHUB_STEP_SUMMARY"
