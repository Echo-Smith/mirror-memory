name: tenancy-perf-decompose2

# Follow-up to tenancy-perf-decompose: only the two steps that were
# broken there (plugin import path for the group timing; cProfile
# attribution script).  Phase splits and pure head/tail already collected
# from run 40168178500.

on:
  workflow_dispatch:

jobs:
  decompose2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (single venv shared by all groups)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,llm,dev]"

      - name: "Group timing: longrun interleaved base/schema/full x3"
        env:
          BASE: 7f783bc
        run: |
          set -u
          measure() {
            local label="$1"; shift
            local start end rc_line
            start=$(python -c 'import time; print(time.monotonic())')
            python -m pytest -q -p no:cacheprovider -p perf_groups_plugin "$@" > /tmp/pytest_out.txt 2>&1 || true
            end=$(python -c 'import time; print(time.monotonic())')
            rc_line=$(grep -oE '[0-9]+ (passed|failed)' /tmp/pytest_out.txt | tail -1)
            echo "$label secs=$(python -c "print(f'{$end-$start:.1f}')") | $rc_line" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          use_base() {
            git checkout -q "$BASE" -- src tests pyproject.toml
            mkdir -p /tmp/spike_tests
            mv tests/test_tenant_isolation.py /tmp/spike_tests/ 2>/dev/null || true
            mv tests/test_tenant_cache_security.py /tmp/spike_tests/ 2>/dev/null || true
          }
          use_fix() {
            git checkout -q 17a244b -- src tests pyproject.toml
            mkdir -p /tmp/spike_tests
            mv tests/test_tenant_isolation.py /tmp/spike_tests/ 2>/dev/null || true
            mv tests/test_tenant_cache_security.py /tmp/spike_tests/ 2>/dev/null || true
          }
          restore_spike_tests() {
            mv /tmp/spike_tests/test_tenant_isolation.py tests/ 2>/dev/null || true
            mv /tmp/spike_tests/test_tenant_cache_security.py tests/ 2>/dev/null || true
          }

          echo "=== LONGRUN: interleaved base/schema/full x3 ===" | tee -a "$GITHUB_STEP_SUMMARY"
          for round in 1 2 3; do
            use_base
            measure "longrun base   r$round" tests/test_longrun_bench.py
            use_fix
            MM_GROUP=schema measure "longrun schema r$round" tests/test_longrun_bench.py
            measure "longrun full   r$round" tests/test_longrun_bench.py
          done
          restore_spike_tests

      - name: "cProfile: longrun base vs full (self-time attribution, lineno-independent)"
        run: |
          set -u
          git checkout -q 7f783bc -- src tests pyproject.toml
          python -m cProfile -o /tmp/base.prof -m pytest tests/test_longrun_bench.py -q -p no:cacheprovider > /dev/null 2>&1 || true
          git checkout -q 17a244b -- src tests pyproject.toml
          python -m cProfile -o /tmp/full.prof -m pytest tests/test_longrun_bench.py -q -p no:cacheprovider > /dev/null 2>&1 || true
          python - <<'PYEOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import pstats

          def load(path):
              st = pstats.Stats(path)
              out = {}
              for func, (cc, nc, tt, ct, callers) in st.stats.items():
                  if func[0] == "~":
                      key = ("~", func[2])          # C builtin: identify by name
                  else:
                      key = (func[0], func[2])      # lineno shifts between revisions
                  tt_sum, ct_sum, nc_sum = out.get(key, (0.0, 0.0, 0))
                  out[key] = (tt_sum + tt, ct_sum + ct, nc_sum + nc)
              return out, st.total_tt

          base, base_tot = load("/tmp/base.prof")
          full, full_tot = load("/tmp/full.prof")
          print(f"cProfile wall totals: base={base_tot:.1f}s full={full_tot:.1f}s delta={full_tot-base_tot:+.1f}s")

          def category(key):
              file, name = key
              f = (file or "").lower()
              if file == "~":
                  if "sqlite" in name.lower() or "cursor" in name.lower():
                      return "(iv) SQLite execution"
                  return "(v) other (C builtins)"
              if "tenancy.py" in f:
                  if "flush" in name or "get" in name:
                      return "(ii) before_flush / get wrapper"
                  return "(i) injection & compile (tenancy)"
              if "lambdas" in f or "cache_key" in f:
                  return "(i) injection & compile (lambda/cachekey)"
              if "ddl" in f or "conftest" in f or "_pytest" in f or "fixture" in name:
                  return "(iii) DDL / fixtures"
              return "(v) other"

          keys = set(base) | set(full)
          rows = []
          for key in keys:
              ft = full.get(key, (0, 0, 0))[0]
              bt = base.get(key, (0, 0, 0))[0]
              rows.append((ft - bt, key, bt, ft))
          rows.sort(reverse=True)

          cats = {}
          for d, key, bt, ft in rows:
              cats[category(key)] = cats.get(category(key), 0.0) + d
          print("category sums of SELF-time delta (full - base), no double counting:")
          for c in sorted(cats, key=cats.get, reverse=True):
              print(f"  {cats[c]:+8.2f}s  {c}")
          print()
          print("top-15 functions by self-time delta:")
          for d, key, bt, ft in rows[:15]:
              if key[0] == "~":
                  where = f"C:{key[1]}"
              else:
                  where = key[0].split("site-packages/")[-1].split("mirror-memory/")[-1] + f"({key[1]})"
              print(f"  {d:+7.2f}s ({bt:6.2f}->{ft:6.2f})  {where}")
          PYEOF

      - name: Final sanity
        run: |
          git checkout -q 17a244b -- src tests pyproject.toml
          python -m pytest -q -p no:cacheprovider 2>&1 | tail -2 | tee -a "$GITHUB_STEP_SUMMARY"
