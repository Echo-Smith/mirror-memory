# system_scope usage allowlist (M1 batch-2 task 1b)
#
# system_scope is the ONLY cross-tenant bypass.  Every call site in engine
# code must be registered here with a reason and a reviewer; the runtime
# check (tests enforce, production warns) and the CI AST scan
# (tools/check_system_scope.py) both compare against this file.
#
# Entries that no longer have a matching call site fail the CI scan too --
# an allowlist with ghosts hides real drift.
#
# Review status: the five schema_migration entries were added by the M2
# batch-1 agent (2026-10-26, marked 待评审) and reviewed by Echo-Smith
# on 2026-10-27 (reason wording for _count_rows / _backfill_column
# corrected in the same pass).

- module: mirror_memory.worker.evolution
  function: process_pending
  reason: >
    The evolution job queue is shared across tenants: crash-recovery sweep
    and the pending-job scan must see every tenant's jobs.  Each job is
    then processed inside tenant_scope(job.tenant_id, job.app_id) with a
    session bound to that tenant.
  reviewer: Echo-Smith
  reviewed_at: "2026-10-25"

- module: mirror_memory.core.schema_migration
  function: _count_rows
  reason: >
    Migration verification counts rows per table across tenants (row-count
    and NULL-tenant checks).  Called only from upgrade_database's verify
    path.
  reviewer: Echo-Smith
  reviewed_at: "2026-10-27"

- module: mirror_memory.core.schema_migration
  function: _backfill_column
  reason: >
    Batched backfill of tenant/other columns: selects primary keys across
    all tenants and updates them with the configured default.  Called only
    from migration steps.  M3 re-review (2026-10-30, Echo-Smith): the
    function body gained composite-primary-key row-value matching and the
    ``marker`` empty-marker predicate -- scope and reason unchanged.
  reviewer: Echo-Smith
  reviewed_at: "2026-10-30"

- module: mirror_memory.core.schema_migration
  function: _verify_column
  reason: >
    Step verification (row-count / NULL checks over the whole table) --
    same cross-tenant maintenance path as the backfill.
  reviewer: Echo-Smith
  reviewed_at: "2026-10-27"

- module: mirror_memory.core.schema_migration
  function: _verify_tenancy
  reason: >
    Step verification for the tenancy conversion: confirms every migrated
    table carries both tenant columns and that no row has a NULL tenant
    value.  Reads whole tables across all tenants; reached only through
    upgrade_database.
  reviewer: Echo-Smith
  reviewed_at: "2026-10-27"

- module: mirror_memory.core.schema_migration
  function: _count_legacy_jobs
  reason: >
    Migration step 6 counts pre-M3 evolution jobs (purpose == '') across
    all tenants -- they will be cancelled at runtime unless the operator
    chose a legacy_job_purpose before upgrading.  The count is logged and
    returned by upgrade_database so the decision is informed.
  reviewer: Echo-Smith
  reviewed_at: "2026-10-30"

- module: mirror_memory.core.schema_migration
  function: _emit_primary_key_swaps
  reason: >
    Converting each tenant table's primary key to the composite tenant key
    is a catalog operation over the whole table, not a row-scoped query;
    there is no tenant to scope it to (the ALTER names no rows).  Reached
    only from Step2TenantPrimaryKeys inside upgrade_database.
  reviewer: Echo-Smith
  reviewed_at: "2026-10-27"

- module: mirror_memory.api
  function: _verify_single_tenant_startup
  reason: >
    Startup invariant for end-side single-tenant mode: reads the DISTINCT
    tenant set once to refuse multi-tenant databases or a mismatched
    configuration.  Runs a single bounded query at engine construction.
  reviewer: Echo-Smith
  reviewed_at: "2026-10-25"

- module: mirror_memory.worker.maintenance
  function: purge_expired_audit
  reason: >
    Audit-retention maintenance (M3 batch 3): enumerates the DISTINCT
    tenants holding access-audit rows once (a read of the audit table's
    tenant columns) so each tenant's retention purge can then run inside
    its own tenant_scope through the sanctioned writer.  The enumeration
    is the only cross-tenant statement; the deletions are per-tenant and
    batched.  Reached from the worker loop's periodic maintenance pass.
  reviewer: Echo-Smith
  reviewed_at: "2026-10-30"
